name: tests
on: [push, pull_request]
jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tests/test-board.py
      - run: python3 tests/test-cloud.py
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash mac/tests/test-sandbox.sh
      - run: python3 tests/test-board.py
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: install the packed npm package and smoke-test the command
        run: |
          npm pack
          npm install -g ./coshift-*.tgz
          coshift --version
          coshift hook | grep -q PostToolUse
          coshift call help | grep -q "Shared task board"
          (coshift demo 7788 &) && sleep 3 && curl -sf http://127.0.0.1:7788/ | grep -q Coshift
